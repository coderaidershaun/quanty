[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie-private", "cookie-key-expansion"] }
backend = { path = "crates/backend" }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
choices = { path = "crates/choices" }
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
contract = { path = "crates/contract" }
dotenvy = "0.15.7"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wgpu"] }
egui-phosphor = { version = "=0.14.0", default-features = false, features = ["light"] }
egui_kittest = { version = "=0.36.2", default-features = false, features = ["eframe", "snapshot", "wgpu"] }
ehttp = { version = "=0.5.0", default-features = false }
export = { path = "crates/export" }
falkordb = { version = "0.10.4", features = ["tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
graph = { path = "crates/graph" }
gui = { path = "crates/gui" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
lopdf = { version = "0.46.0", default-features = false }
ocr = { path = "crates/ocr" }
percent-encoding = { version = "2.3.2", default-features = false, features = ["std"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
qdrant-client = { version = "1.19.0", default-features = false, features = ["serde"] }
rag-core = { path = "crates/rag-core" }
rag-dataset = { path = "crates/rag-dataset" }
rag-ingestion = { path = "crates/rag-ingestion" }
rag-retrieval = { path = "crates/rag-retrieval" }
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-render = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
reqwest = { version = "0.13.5", features = ["json"] }
rfd = { version = "0.17.2", default-features = false }
rmcp = { version = "3.5.1", default-features = false, features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
rust-embed = { version = "8.13.0", default-features = false, features = ["debug-embed"] }
rustybuzz = { version = "0.20.1", default-features = false, features = ["std"] }
schemars = { version = "1.2.2", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = "1.53.2"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
unicode-normalization = { version = "0.1.26", default-features = false }
uuid = { version = "1.27.0", default-features = false, features = ["serde", "std", "v4", "v5", "js"] }
web-time = { version = "1.1.0", default-features = false }

[profile.dev.package."*"]
debug = false
opt-level = 2
