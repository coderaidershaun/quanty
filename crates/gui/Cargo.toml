[package]
name = "gui"
version.workspace = true
edition.workspace = true

[features]
testing = ["dep:egui_kittest", "dep:backend", "dep:percent-encoding", "dep:tempfile"]

[dependencies]
backend = { workspace = true, optional = true, features = ["testing"] }
choices.workspace = true
contract.workspace = true
eframe.workspace = true
egui-phosphor.workspace = true
egui_kittest = { workspace = true, optional = true }
ehttp.workspace = true
export.workspace = true
image.workspace = true
percent-encoding = { workspace = true, optional = true }
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-render.workspace = true
ratex-types.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
web-time.workspace = true

[dev-dependencies]
gui = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd.workspace = true
