[package]
name = "mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "quanty-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
graph.workspace = true
ocr.workspace = true
rag-core.workspace = true
rag-ingestion.workspace = true
rag-retrieval.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
ocr = { workspace = true, features = ["testing"] }
rag-ingestion = { workspace = true, features = ["testing"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
