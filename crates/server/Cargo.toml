[package]
name = "server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "quanty"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["form", "json", "query", "ws"] }
axum-extra.workspace = true
backend.workspace = true
choices.workspace = true
clap.workspace = true
contract.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
image.workspace = true
mcp = { path = "../mcp" }
percent-encoding.workspace = true
rag-core.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
export.workspace = true
futures-util = { workspace = true, features = ["sink"] }
ocr.workspace = true
rag-ingestion.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
tokio-tungstenite.workspace = true
