[package]
name = "web-ui"
version.workspace = true
edition.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
contract.workspace = true
eframe.workspace = true
ehttp.workspace = true
ewebsock.workspace = true
gui.workspace = true
log.workspace = true
percent-encoding.workspace = true
rfd.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "Event", "EventTarget", "History", "HtmlCanvasElement", "KeyboardEvent", "Location", "Url", "Window", "console"] }
web-time.workspace = true
# eframe can fall back to WebGL only when wgpu enables it.
wgpu = { workspace = true, features = ["webgl"] }
